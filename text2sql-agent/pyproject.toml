[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text2sql-agent"
version = "0.1.0"
description = "A self-correcting, read-only natural-language-to-SQL agent with a reproducible benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=0.40", "openai>=1.40"]

[project.optional-dependencies]
app = ["streamlit>=1.50", "pandas>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
text2sql = "text2sql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
